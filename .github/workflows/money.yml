name: Windows Cloud RDP - Free Tier Maxed

on:
  workflow_dispatch:
    inputs:
      ollama_model:
        description: 'Ollama model to pre-pull'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 0. Max Out Free Runner Performance
      # ==========================================
      - name: 0. Free Runner Max Performance
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "FREE RUNNER MAX OPTIMIZATION"
          Write-Host "=========================================="

          # Ultimate Performance Power Plan
          $UltimatePlan = powercfg /list | Select-String "Ultimate Performance"
          
          if ($UltimatePlan) {
              $UltimateGUID = ($UltimatePlan -split '\s+')[3]
              powercfg /setactive $UltimateGUID
              Write-Host "Ultimate Performance activated."
          } else {
              powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61
              powercfg /setactive e9a42b02-d5df-448d-aa00-03f14749eb61
              Write-Host "Ultimate Performance created and activated."
          }

          # Disable Power Throttling
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling" `
            -Name "PowerThrottlingOff" `
            -Value 1 `
            -Force

          # Disable Core Parking
          $CoreParkingPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\54533251-82be-4824-96c1-47b60b740d00\0cc5b647-c1df-4637-891a-dec35c318583"

          Set-ItemProperty -Path $CoreParkingPath -Name "ValueMin" -Value 100 -Force
          Set-ItemProperty -Path $CoreParkingPath -Name "ValueMax" -Value 100 -Force

          # CPU Min/Max 100%
          $ProcPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\54533251-82be-4824-96c1-47b60b740d00\bc5038f7-23e0-4960-96da-33abaf5935ec"

          Set-ItemProperty -Path $ProcPath -Name "ValueMin" -Value 100 -Force
          Set-ItemProperty -Path $ProcPath -Name "ValueMax" -Value 100 -Force

          powercfg /setacvalueindex scheme_current sub_processor PROCTHROTTLEMIN 100
          powercfg /setacvalueindex scheme_current sub_processor PROCTHROTTLEMAX 100
          powercfg /setactive scheme_current

          # Priority boost for current process
          $CurrentProcess = Get-Process -Id $PID
          $CurrentProcess.PriorityClass = "High"

          # Enable large pages (requires admin)
          try {
              $LargePagesPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management"
              Set-ItemProperty -Path $LargePagesPath -Name "LargeSystemCache" -Value 1 -Force
              Write-Host "Large system cache enabled."
          } catch {
              Write-Host "Large system cache skipped."
          }

          # Disable unnecessary services
          $ServicesToStop = @(
              "WSearch",
              "Spooler",
              "SysMain",
              "DiagTrack",
              "dmwappushservice",
              "MapsBroker",
              "lfsvc",
              "PcaSvc",
              "WMPNetworkSvc",
              "XblAuthManager",
              "XblGameSave",
              "XboxNetApiSvc"
          )

          foreach ($Service in $ServicesToStop) {
              try {
                  Stop-Service -Name $Service -Force -ErrorAction Stop
                  Set-Service -Name $Service -StartupType Disabled -ErrorAction Stop
                  Write-Host "Disabled: $Service"
              } catch {
                  Write-Host "Skipped: $Service"
              }
          }

          # Clear temp files
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue

          # Set environment variables for max threads
          [System.Environment]::SetEnvironmentVariable("NUMBER_OF_PROCESSORS", [Environment]::ProcessorCount.ToString(), "Machine")
          [System.Environment]::SetEnvironmentVariable("OMP_NUM_THREADS", [Environment]::ProcessorCount.ToString(), "Machine")
          [System.Environment]::SetEnvironmentVariable("MKL_NUM_THREADS", [Environment]::ProcessorCount.ToString(), "Machine")
          [System.Environment]::SetEnvironmentVariable("OPENBLAS_NUM_THREADS", [Environment]::ProcessorCount.ToString(), "Machine")

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "HARDWARE INFO"
          Write-Host "=========================================="

          $CPU = Get-CimInstance Win32_Processor
          Write-Host "CPU: $($CPU.Name)"
          Write-Host "Cores: $($CPU.NumberOfCores)"
          Write-Host "Threads: $($CPU.NumberOfLogicalProcessors)"
          Write-Host "Max Clock: $($CPU.MaxClockSpeed) MHz"
          Write-Host "L2 Cache: $([math]::Round($CPU.L2CacheSize / 1024, 1)) MB"
          Write-Host "L3 Cache: $([math]::Round($CPU.L3CacheSize / 1024, 1)) MB"

          $RAM = Get-CimInstance Win32_ComputerSystem
          $Memory = Get-CimInstance Win32_PhysicalMemory
          Write-Host ""
          Write-Host "RAM: $([math]::Round($RAM.TotalPhysicalMemory / 1GB, 2)) GB"
          Write-Host "Memory Speed: $($Memory[0].Speed) MHz"
          Write-Host "Memory Modules: $($Memory.Count)"

          Write-Host ""
          Write-Host "CPU BENCHMARK:"
          $BenchTime = Measure-Command {
              $result = 0.0
              for ($i = 1; $i -le 20000000; $i++) {
                  $result += [math]::Sqrt($i)
              }
          }
          Write-Host "20M sqrt operations: $($BenchTime.TotalSeconds) seconds"
          Write-Host "Performance: $([math]::Round(20000000 / $BenchTime.TotalSeconds, 0)) ops/sec"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "OPTIMIZATION COMPLETE"
          Write-Host "=========================================="


      # ==========================================
      # 1. Install Python 3.12, VS Code, WinRAR, Ollama
      # ==========================================
      - name: 1. Install Python, VS Code, WinRAR & Ollama
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Python 3.12..."

          winget install --id Python.Python.3.12 --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "Installing Visual Studio Code..."

          winget install --id Microsoft.VisualStudioCode --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "Installing WinRAR..."

          winget install --id RARLab.WinRAR --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements

          # Refresh PATH
          $env:Path = `
            [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
            [System.Environment]::GetEnvironmentVariable("Path","User")

          # ==========================================
          # Install Ollama - Optimized
          # ==========================================
          Write-Host ""
          Write-Host "Installing Ollama..."

          # Set Ollama to use all cores
          [System.Environment]::SetEnvironmentVariable("OLLAMA_NUM_THREADS", [Environment]::ProcessorCount.ToString(), "Machine")
          [System.Environment]::SetEnvironmentVariable("OLLAMA_NUM_PARALLEL", [Environment]::ProcessorCount.ToString(), "Machine")
          [System.Environment]::SetEnvironmentVariable("OLLAMA_MAX_LOADED_MODELS", "1", "Machine")
          [System.Environment]::SetEnvironmentVariable("OLLAMA_KEEP_ALIVE", "24h", "Machine")

          $OllamaInstaller = "$env:TEMP\OllamaSetup.exe"

          Invoke-WebRequest `
            -Uri "https://ollama.com/download/OllamaSetup.exe" `
            -OutFile $OllamaInstaller

          if (!(Test-Path $OllamaInstaller)) {
              throw "Ollama installer download failed."
          }

          Start-Process `
            -FilePath $OllamaInstaller `
            -ArgumentList "/silent" `
            -Wait

          Start-Sleep -Seconds 10

          # Refresh PATH again
          $env:Path = `
            [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
            [System.Environment]::GetEnvironmentVariable("Path","User")

          $OllamaPaths = @(
              "$env:LOCALAPPDATA\Programs\Ollama\ollama.exe",
              "$env:ProgramFiles\Ollama\ollama.exe"
          )

          $Ollama = $null

          foreach ($Path in $OllamaPaths) {
              if (Test-Path $Path) {
                  $Ollama = $Path
                  break
              }
          }

          if ($null -eq $Ollama) {
              $OllamaCommand = Get-Command ollama.exe -ErrorAction SilentlyContinue

              if ($null -ne $OllamaCommand) {
                  $Ollama = $OllamaCommand.Source
              }
          }

          if ($null -eq $Ollama) {
              throw "Ollama installation failed."
          }

          Write-Host "Ollama installed."
          & $Ollama --version

          # Pre-pull model if specified
          if ($env:OLLAMA_MODEL -ne "") {
              Write-Host "Pulling model: $env:OLLAMA_MODEL"
              & $Ollama pull $env:OLLAMA_MODEL
          }

          # ==========================================
          # Download MoneyPrinterTurbo Keys
          # ==========================================
          Write-Host ""
          Write-Host "Downloading MoneyPrinterTurbo Keys..."

          $Downloads = Join-Path $env:USERPROFILE "Downloads"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $Downloads | Out-Null

          $KeysUrl = "https://raw.githubusercontent.com/defaultshomareyeke/didactic-system/refs/heads/main/moneyprinterturbo-keys.json"
          $KeysPath = Join-Path $Downloads "moneyprinterturbo-keys.json"

          Invoke-WebRequest `
            -Uri $KeysUrl `
            -OutFile $KeysPath

          Write-Host "Keys downloaded."
        env:
          OLLAMA_MODEL: ${{ github.event.inputs.ollama_model }}


      # ==========================================
      # 2. Enable Remote Desktop
      # ==========================================
      - name: 2. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          # Enable hardware acceleration over RDP
          Set-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "bEnumerateHWBeforeTS" `
            -Value 1 `
            -Force

          Write-Host "Remote Desktop enabled."


      # ==========================================
      # 3. Create Admin Account
      # ==========================================
      - name: 3. Create Admin Account
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Username = "iliya"
          $PasswordText = "123"

          $Password = ConvertTo-SecureString `
            $PasswordText `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -ne $ExistingUser) {
              Remove-LocalUser `
                -Name $Username `
                -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $Username `
            -Password $Password `
            -PasswordNeverExpires `
            -UserMayNotChangePassword `
            -Description "RDP Administrator"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP USER CONFIGURED"
          Write-Host "=========================================="
          Write-Host "Username : $Username"
          Write-Host "Password : $PasswordText"
          Write-Host "Port     : 3389"
          Write-Host "Cores    : $([Environment]::ProcessorCount)"
          Write-Host "=========================================="


      # ==========================================
      # 4. Install & Connect Tailscale
      # ==========================================
      - name: 4. Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 8

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
              throw "Tailscale installation failed."
          }

          Write-Host "Connecting to Tailscale..."

          & $Tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-max"

          Start-Sleep -Seconds 10

          $ts_ip = & $Tailscale ip -4

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "         RDP SERVER READY (MAX OPTIMIZED)"
          Write-Host "=================================================="
          Write-Host "Tailscale IP : $ts_ip"
          Write-Host "Username     : iliya"
          Write-Host "Password     : 123"
          Write-Host "Port         : 3389"
          Write-Host "=================================================="


      # ==========================================
      # 5. Download MoneyPrinter Projects
      # ==========================================
      - name: 5. Download MoneyPrinter Projects
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Base = "C:\MoneyPrinters"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $Base | Out-Null

          Write-Host ""
          Write-Host "Downloading MoneyPrinter..."

          git clone `
            --depth 1 `
            https://github.com/FujiwaraChoki/MoneyPrinter.git `
            "$Base\MoneyPrinter"

          Write-Host ""
          Write-Host "Downloading MoneyPrinterV2..."

          git clone `
            --depth 1 `
            https://github.com/FujiwaraChoki/MoneyPrinterV2.git `
            "$Base\MoneyPrinterV2"

          Write-Host ""
          Write-Host "Downloading MoneyPrinterTurbo..."

          git clone `
            --depth 1 `
            https://github.com/harry0703/MoneyPrinterTurbo.git `
            "$Base\MoneyPrinterTurbo"

          Write-Host ""
          Write-Host "All projects downloaded."

          Get-ChildItem $Base |
            Select-Object Name, FullName


      # ==========================================
      # 6. Prepare Fonts Folders
      # ==========================================
      - name: 6. Prepare Fonts Folders
        shell: powershell
        run: |
          $Base = "C:\MoneyPrinters"

          $Projects = @(
            "$Base\MoneyPrinter",
            "$Base\MoneyPrinterV2",
            "$Base\MoneyPrinterTurbo"
          )

          foreach ($Project in $Projects) {

              $Fonts = Join-Path $Project "fonts"

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $Fonts | Out-Null

              Write-Host "Fonts folder ready:"
              Write-Host $Fonts
          }


      # ==========================================
      # 7. Download Vazirmatn from GitHub
      # ==========================================
      - name: 7. Add Vazirmatn to MoneyPrinterV2
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Base = "C:\MoneyPrinters"
          $ProjectFonts = "$Base\MoneyPrinterV2\fonts"
          $VazirRepo = "C:\vazirmatn"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $ProjectFonts | Out-Null

          Write-Host ""
          Write-Host "Downloading Vazirmatn..."

          git clone `
            --depth 1 `
            https://github.com/rastikerdar/vazirmatn.git `
            $VazirRepo

          if (!(Test-Path $VazirRepo)) {
              throw "Vazirmatn repository was not downloaded."
          }

          $FontFiles = Get-ChildItem `
            $VazirRepo `
            -Recurse `
            -Include *.ttf,*.otf

          if ($FontFiles.Count -eq 0) {
              throw "No Vazirmatn font files were found."
          }

          foreach ($Font in $FontFiles) {

              Copy-Item `
                $Font.FullName `
                $ProjectFonts `
                -Force

              Write-Host "Copied: $($Font.Name)"
          }

          Write-Host ""
          Write-Host "Vazirmatn installation complete."

          Get-ChildItem `
            $ProjectFonts `
            -Include *.ttf,*.otf |
            Select-Object Name, Length


      # ==========================================
      # 8. Verify Project Structure
      # ==========================================
      - name: 8. Verify Projects
        shell: powershell
        run: |
          $Base = "C:\MoneyPrinters"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "MoneyPrinter"
          Write-Host "=============================================="

          Get-ChildItem `
            "$Base\MoneyPrinter" `
            -Force |
            Select-Object Name, Mode

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "MoneyPrinterV2"
          Write-Host "=============================================="

          Get-ChildItem `
            "$Base\MoneyPrinterV2" `
            -Force |
            Select-Object Name, Mode

          Write-Host ""
          Write-Host "MoneyPrinterV2 Fonts:"

          Get-ChildItem `
            "$Base\MoneyPrinterV2\fonts" `
            -Include *.ttf,*.otf |
            Select-Object Name

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "MoneyPrinterTurbo"
          Write-Host "=============================================="

          Get-ChildItem `
            "$Base\MoneyPrinterTurbo" `
            -Force |
            Select-Object Name, Mode


      # ==========================================
      # 9. System Information
      # ==========================================
      - name: 9. Show System Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== CPU =========="

          Get-CimInstance Win32_Processor |
            Select-Object Name,
              NumberOfCores,
              NumberOfLogicalProcessors,
              MaxClockSpeed,
              L2CacheSize,
              L3CacheSize

          Write-Host ""
          Write-Host "========== RAM =========="

          $RAM = Get-CimInstance Win32_ComputerSystem
          $Memory = Get-CimInstance Win32_PhysicalMemory

          Write-Host "Total RAM: $([math]::Round($RAM.TotalPhysicalMemory / 1GB, 2)) GB"
          Write-Host "Memory Speed: $($Memory[0].Speed) MHz"
          Write-Host "Memory Modules: $($Memory.Count)"

          Write-Host ""
          Write-Host "========== C: DRIVE =========="

          $Drive = Get-PSDrive C

          Write-Host "Used:"
          Write-Host "$([math]::Round($Drive.Used / 1GB, 2)) GB"

          Write-Host "Free:"
          Write-Host "$([math]::Round($Drive.Free / 1GB, 2)) GB"


      # ==========================================
      # 10. Keep Server Alive - 6 Hours
      # ==========================================
      - name: 10. Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 360; $i++) {

              Start-Sleep -Seconds 60

              $free = Get-PSDrive C |
                Select-Object -ExpandProperty Free

              $freeGB = [math]::Round(
                $free / 1GB,
                2
              )

              $cpuLoad = (Get-CimInstance Win32_Processor).LoadPercentage

              Write-Host "[$i/360] Server running | CPU: $cpuLoad% | C: Free = $freeGB GB"
          }
